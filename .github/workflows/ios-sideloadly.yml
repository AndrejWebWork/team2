# Unsigned iOS IPA for Sideloadly (Windows) — NO paid Apple Developer account.
# Download artifact → Sideloadly + free Apple ID → install on iPhone (~7 days).
name: iOS Sideloadly IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'ios/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/ios-sideloadly.yml'

concurrency:
  group: ios-sideloadly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Copy web assets to iOS
        run: npx cap copy ios

      - name: Normalize SPM paths for macOS
        run: |
          set -euo pipefail
          PKG=ios/App/CapApp-SPM/Package.swift
          sed -i '' 's|\\|/|g' "$PKG"
          test -f "$PKG"
          grep 'node_modules' "$PKG"

      - name: Resolve Swift packages
        run: |
          set -euo pipefail
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -resolvePackageDependencies

      - name: Archive without code signing
        run: |
          set -euo pipefail
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            archive

      - name: Package IPA for Sideloadly
        run: |
          set -euo pipefail
          APP_PATH=$(find build/App.xcarchive/Products/Applications -maxdepth 1 -name '*.app' -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "::error::Could not find .app in archive"
            exit 1
          fi
          mkdir -p build/sideloadly/Payload
          cp -R "$APP_PATH" build/sideloadly/Payload/
          cd build/sideloadly
          zip -qr ../EkoSkopje-unsigned.ipa Payload
          ls -lh ../EkoSkopje-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: EkoSkopje-sideloadly-ipa
          path: build/EkoSkopje-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

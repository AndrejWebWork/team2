# Unsigned iOS IPA for Sideloadly (Windows) — NO paid Apple Developer account.
# Download artifact → Sideloadly + free Apple ID → install on iPhone (~7 days).
name: iOS Sideloadly IPA

on:
  workflow_dispatch:

concurrency:
  group: ios-sideloadly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-unsigned-ipa:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Archive without code signing
        run: |
          set -euo pipefail
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            archive

      - name: Package IPA for Sideloadly
        run: |
          set -euo pipefail
          APP_PATH=$(find build/App.xcarchive/Products/Applications -maxdepth 1 -name '*.app' -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "::error::Could not find .app in archive"
            exit 1
          fi
          mkdir -p build/sideloadly/Payload
          cp -R "$APP_PATH" build/sideloadly/Payload/
          cd build/sideloadly
          zip -qr ../EkoSkopje-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: EkoSkopje-sideloadly-ipa
          path: build/EkoSkopje-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

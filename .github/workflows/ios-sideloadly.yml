# Unsigned iOS IPA for Sideloadly (Windows) — NO paid Apple Developer account.
# Download artifact → Sideloadly + free Apple ID → install on iPhone (~7 days).
name: iOS Sideloadly IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'ios/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/ios-sideloadly.yml'

concurrency:
  group: ios-sideloadly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev
        env:
          NODE_ENV: development

      - name: Build web app
        env:
          VITE_WAQI_TOKEN: ${{ secrets.VITE_WAQI_TOKEN }}
        run: npm run build

      - name: Sync Capacitor iOS (native plugins)
        run: npx cap sync ios

      - name: Copy web assets to iOS
        run: |
          set -euo pipefail
          rm -rf ios/App/App/public
          mkdir -p ios/App/App/public
          cp -R dist/. ios/App/App/public/
          cp capacitor.config.json ios/App/App/capacitor.config.json
          cat > ios/App/App/config.xml <<'EOF'
          <?xml version='1.0' encoding='utf-8'?>
          <widget version="1.0.0" xmlns="http://www.w3.org/ns/widgets" xmlns:cdv="http://cordova.apache.org/ns/1.0">
            <access origin="*" />
          </widget>
          EOF
          test -f ios/App/App/public/index.html
          test -f ios/App/App/config.xml

      - name: Normalize SPM paths for macOS
        run: |
          set -euo pipefail
          PKG=ios/App/CapApp-SPM/Package.swift
          sed -i '' 's|\\|/|g' "$PKG"
          test -f "$PKG"

      - name: Resolve Swift packages
        run: |
          set -euo pipefail
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -resolvePackageDependencies

      - name: Build app without code signing
        run: |
          set -euo pipefail
          mkdir -p build
          if ! xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=- \
            EXPANDED_CODE_SIGN_IDENTITY= \
            CODE_SIGN_ENTITLEMENTS= \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= \
            ONLY_ACTIVE_ARCH=NO \
            build > build/xcodebuild.log 2>&1; then
            echo "::group::xcodebuild errors"
            grep -E 'error:|fatal error:|BUILD FAILED' build/xcodebuild.log | tail -n 40 || tail -n 80 build/xcodebuild.log
            echo "::endgroup::"
            exit 1
          fi

      - name: Package IPA for Sideloadly
        run: |
          set -euo pipefail
          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "::error::Could not find .app in build output"
            find build/DerivedData/Build/Products -name '*.app' || true
            exit 1
          fi
          mkdir -p build/sideloadly/Payload
          cp -R "$APP_PATH" build/sideloadly/Payload/
          cd build/sideloadly
          zip -qr ../EkoSkopje-unsigned.ipa Payload
          ls -lh ../EkoSkopje-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: EkoSkopje-sideloadly-ipa
          path: build/EkoSkopje-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
